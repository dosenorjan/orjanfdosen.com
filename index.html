<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ørjan F. Døsen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="artist-page">

        <section class="entrance">

            <img
                class="dosen-signature"
                src="images/dosen-signatur.png"
                alt="Døsen"
            >

            <figure class="artwork-card entrance-work">
                <img
                    class="self-portrait-image artwork"
                    src="images/selvportrett_23_clean_red.png"
                    alt="Selvportrett 23"
                >
                <figcaption>
                    <div class="artwork-meta">
                        <h2>Selvportrett 23</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Kunstneren, 37 år inn i livet.</p></div>
                        <div class="artwork-details">30 × 40 cm · olje</div>
                    </div>
                </figcaption>
            </figure>

        </section>


        <!-- X 1 -->

        <section class="x-section">

            <div class="x-row">

                <figure class="artwork-card x-side">
                    <img
                        class="artwork"
                        src="images/ridder_clean_red.png"
                        alt="Temmer av beist"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Temmer av beist</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Mann fikk herredømme over alle skapningene.</p></div>
                        <div class="artwork-details">48 × 61 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

                <figure class="artwork-card x-center">
                    <img
                        class="artwork"
                        src="images/king_of_the_jews_clean_red.png"
                        alt="King of the Jews"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>King of the Jews</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Ordene «King of the Jews» ble satt over Jesus som hån. Jesu kors bar menneskehetens synder. Ditt kors er til sammenligning to fyrstikker.</p></div>
                        <div class="artwork-details">100 × 120 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

                <figure class="artwork-card x-side">
                    <img
                        class="artwork"
                        src="images/kristus_rex_clean_red.png"
                        alt="Kristus Rex"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Kristus Rex</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Et portrett av en tilfeldig mann som kunstneren først trodde var Jesus.</p></div>
                        <div class="artwork-details">40 × 50 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

            </div>

            <div class="x-row x-row-lower">

                <figure class="artwork-card x-side">
                    <img
                        class="artwork"
                        src="images/dapen_clean_red.png"
                        alt="Dåpen"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Dåpen</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Alle døpte med vann. Én døpte med Den hellige ånd.</p></div>
                        <div class="artwork-details">77 × 50 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

                <figure class="artwork-card x-side">
                    <img
                        class="artwork"
                        src="images/livets_sirkel_clean_red.png"
                        alt="Livets sirkel"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Livets sirkel</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Et mønster som gjentar seg i alt fra matretter til årstider: fødsel, liv, nedbrytning, død, forvandling.</p></div>
                        <div class="artwork-details">80 × 71 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

            </div>

        </section>


        <!-- MELLOMROM / TO VERK -->

        <section class="interlude">

            <figure class="artwork-card">
                <img
                    class="artwork"
                    src="images/livets_bok_clean_red.png"
                    alt="Livets bok"
                >
                <figcaption>
                    <div class="artwork-meta">
                        <h2>Livets bok</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>En referanse til «Livets bok», der navnene til de hellige står skrevet. Figurene er hentet fra italiensk maleri.</p></div>
                        <div class="artwork-details">38 × 29 cm · olje</div>
                    </div>
                </figcaption>
            </figure>

            <figure class="artwork-card">
                <img
                    class="artwork"
                    src="images/mine_sko_clean_red.png"
                    alt="Mine Sko"
                >
                <figcaption>
                    <div class="artwork-meta">
                        <h2>Mine Sko</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Jeg har alltid hatt store føtter. Hvert menneske har sitt eget ganglag.</p></div>
                        <div class="artwork-details">140 × 150 cm · olje</div>
                    </div>
                </figcaption>
            </figure>

        </section>


        <!-- STOR LUFT MELLOM X 1 OG X 2 -->

        <div class="major-air"></div>


        <!-- X 2 -->

        <section class="x-section x-section-two">

            <div class="x-row">

                <figure class="artwork-card x-side">
                    <img
                        class="artwork"
                        src="images/jesus_pa_vann_clean_red.png"
                        alt="Jesus på Vann"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Jesus på Vann</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Uten tro synker du.</p></div>
                        <div class="artwork-details">60 × 80 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

                <figure class="artwork-card x-center">
                    <img
                        class="artwork"
                        src="images/revelation_clean_red.png"
                        alt="Revelation"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Revelation</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>«Ta bokrullen og spis den! Den vil svi i magen din, men i munnen din skal den være søt som honning.»</p><p>«Så tok jeg den lille bokrullen av engelens hånd og spiste den, og i munnen var den søt som honning. Men da jeg hadde svelget den, sved det i magen.»</p><small>Johannes' åpenbaring 10:9–10</small></div>
                        <div class="artwork-details">150 × 120 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

                <figure class="artwork-card x-side">
                    <img
                        class="artwork"
                        src="images/jomfru_maria_clean_red.png"
                        alt="Kvinnen kledd i solen"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Kvinnen kledd i solen</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>En mann fikk en rosetorn i øyet. Hans første reaksjon var å be rosenkransen.</p></div>
                        <div class="artwork-details">60 × 80 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

            </div>

            <div class="x-row x-row-lower">

                <figure class="artwork-card x-side">
                    <img
                        class="artwork"
                        src="images/dd_jesus_clean_red.png"
                        alt="Død Jesus"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Død Jesus</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>En detalj fra et Carpaccio-maleri som ikke ble glemt. Den fortjente å bli et eget bilde.</p></div>
                        <div class="artwork-details">80 × 61 cm · akryl</div>
                    </div>
                </figcaption>
                </figure>

                <figure class="artwork-card x-side">
                    <img
                        class="artwork"
                        src="images/charlie_kirk_clean_red.png"
                        alt="Charlie Kirk"
                    >
                    <figcaption>
                    <div class="artwork-meta">
                        <h2>Charlie Kirk</h2>
                        <button class="info-toggle" type="button" aria-expanded="false">info</button>
                    </div>
                    <div class="artwork-info" aria-hidden="true">
                        <div class="info-sentence"><p>Husket som en modig mann.</p></div>
                        <div class="artwork-details">40 × 60 cm · olje</div>
                    </div>
                </figcaption>
                </figure>

            </div>

        </section>

    </main>


    <!-- STORT BILDE -->

    <div class="lightbox" id="lightbox" aria-hidden="true">

        <img
            class="lightbox-image"
            id="lightbox-image"
            src=""
            alt=""
        >

    </div>


    <script>
        const artworks = document.querySelectorAll(".artwork");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");

        function openLightbox(artwork) {
            lightboxImage.src = artwork.src;
            lightboxImage.alt = artwork.alt;
            lightbox.classList.add("open");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.classList.add("lightbox-open");
        }

        function closeLightbox() {
            lightbox.classList.remove("open");
            lightbox.setAttribute("aria-hidden", "true");
            lightboxImage.src = "";
            lightboxImage.alt = "";
            document.body.classList.remove("lightbox-open");
        }

        artworks.forEach((artwork) => {
            artwork.addEventListener("click", () => openLightbox(artwork));
        });

        document.querySelectorAll(".info-toggle").forEach((button) => {
            button.addEventListener("click", () => {
                const info = button.closest("figcaption").querySelector(".artwork-info");
                const open = button.getAttribute("aria-expanded") === "true";
                button.setAttribute("aria-expanded", String(!open));
                info.setAttribute("aria-hidden", String(open));
                info.classList.toggle("is-open", !open);
                button.textContent = open ? "info" : "info −";
            });
        });

        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) closeLightbox();
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeLightbox();
        });
    </script>

</body>
</html>
