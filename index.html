<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ørjan F. Døsen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="artist-page">

        <section class="entrance">

            <img
                class="dosen-signature"
                src="images/dosen-signatur.png"
                alt="Døsen"
            >

            <img
                class="self-portrait-image artwork"
                src="images/selvportrett_23_clean_red.png"
                alt="Selvportrett 23"
            >

        </section>


        <!-- X 1 -->

        <section class="x-section">

            <div class="x-row">

                <div class="x-side">
                    <img
                        class="artwork"
                        src="images/ridder_clean_red.png"
                        alt="Ridder"
                    >
                </div>

                <div class="x-center">
                    <img
                        class="artwork"
                        src="images/king_of_the_jews_clean_red.png"
                        alt="King of the Jews"
                    >
                </div>

                <div class="x-side">
                    <img
                        class="artwork"
                        src="images/kristus_rex_clean_red.png"
                        alt="Kristus Rex"
                    >
                </div>

            </div>

            <div class="x-row x-row-lower">

                <div class="x-side">
                    <img
                        class="artwork"
                        src="images/dapen_clean_red.png"
                        alt="Dåpen"
                    >
                </div>

                <div class="x-side">
                    <img
                        class="artwork"
                        src="images/livets_sirkel_clean_red.png"
                        alt="Livets sirkel"
                    >
                </div>

            </div>

        </section>


        <!-- STOR LUFT MELLOM X 1 OG X 2 -->

        <div class="major-air"></div>


        <!-- X 2 -->

        <section class="x-section x-section-two">

            <div class="x-row">

                <div class="x-side">
                    <img
                        class="artwork"
                        src="images/jesus_pa_vann_clean_red.png"
                        alt="Jesus på Vann"
                    >
                </div>

                <div class="x-center">
                    <img
                        class="artwork"
                        src="images/revelation_clean_red.png"
                        alt="Revelation"
                    >
                </div>

                <div class="x-side">
                    <img
                        class="artwork"
                        src="images/jomfru_maria_clean_red.png"
                        alt="Jomfru Maria"
                    >
                </div>

            </div>

            <div class="x-row x-row-lower">

                <div class="x-side">
                    <img
                        class="artwork"
                        src="images/dd_jesus_clean_red.png"
                        alt="Død Jesus"
                    >
                </div>

                <div class="x-side">
                    <img
                        class="artwork"
                        src="images/charlie_kirk_clean_red.png"
                        alt="Charlie Kirk"
                    >
                </div>

            </div>

        </section>

    </main>


    <!-- STORT BILDE -->

    <div class="lightbox" id="lightbox" aria-hidden="true">

        <img
            class="lightbox-image"
            id="lightbox-image"
            src=""
            alt=""
        >

    </div>


    <script>

        const artworks = document.querySelectorAll(".artwork");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");

        function openLightbox(artwork) {
            lightboxImage.src = artwork.src;
            lightboxImage.alt = artwork.alt;

            lightbox.classList.add("open");
            lightbox.setAttribute("aria-hidden", "false");

            document.body.classList.add("lightbox-open");
        }

        function closeLightbox() {
            lightbox.classList.remove("open");
            lightbox.setAttribute("aria-hidden", "true");

            lightboxImage.src = "";
            lightboxImage.alt = "";

            document.body.classList.remove("lightbox-open");
        }

        artworks.forEach((artwork) => {
            artwork.addEventListener("click", () => {
                openLightbox(artwork);
            });
        });

        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });

    </script>

</body>
</html>
